<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FISHINGLORY - Register</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- Font Awesome (optional, if you use icons elsewhere) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Your custom stylesheet -->
    <link rel="stylesheet" href="style.css">

    <link rel="icon" href="Images/logo_rounded.png">
</head>
<body>
    <div class="container">
        <div class="row vh-100 align-items-center justify-content-center"> 
            <div class="col-sm-8 col-md-6 col-lg-4 rounded p-4 shadow custom-bg">
            
                <!-- Logo -->
                <div class="row justify-content-center mb-4">
                    <img src="Images/logo_rounded.png" class="w-50" alt="FISHINGLORY Logo"/>
                </div>

                <!-- Registration Form -->
                <form action="/your-register-endpoint" method="POST"> <!-- Replace with your actual backend endpoint -->
                    <div class="mb-3">   
                        <label for="fullName" class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="fullName" name="fullName" placeholder="Enter your full name" required>
                    </div>

                    <div class="mb-3">   
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" name="email" placeholder="Enter email" required>
                    </div>

                    <div class="mb-3">   
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" placeholder="Choose a username" required>
                    </div>

                    <div class="mb-3">   
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" placeholder="Create a password" required>
                    </div>

                    <div class="mb-4">   
                        <label for="confirmPassword" class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password" required>
                    </div>

                    <div class="mb-4 form-check">
                        <input type="checkbox" class="form-check-input" id="terms" required>
                        <label for="terms" class="form-check-label">
                            I agree to the <a href="#" class="text-decoration-none">Terms & Conditions</a>
                        </label>
                    </div>

                    <button type="submit" class="btn w-100 custom-btn">Register</button>
                </form>

                <p class="mt-3 mb-0 text-center">
                    Already have an account? 
                    <a href="index.html" class="text-decoration-none">Login here!</a>
                </p>

            </div>
        </div>
    </div>

    <!-- Bootstrap JS (optional here, but good to include if you add any interactive features later) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
